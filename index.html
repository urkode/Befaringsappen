<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#24143a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fix.css" />
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="polish.css" />
    <link rel="stylesheet" href="finish.css" />
    <link rel="stylesheet" href="icons.css" />
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="sticky.css" />
    <title>Befaringsskisse</title>
  </head>
  <body>
    <main id="app">
      <section id="startView" class="start-view">
        <div class="start-actions">
          <button id="openImageSource" class="primary-button upload-button" aria-label="Velg bilde"></button>
          <input id="imageUpload" type="file" accept="image/*" hidden />
          <input id="cameraUpload" type="file" accept="image/*" capture="environment" hidden />
        </div>
        <div class="edge-tint" aria-hidden="true"></div>
        <span class="brand-studios" aria-hidden="true">Studios</span>
        <div id="imageSourceDialog" class="image-source-dialog hidden" role="dialog" aria-modal="true" aria-label="Velg bilde">
          <div class="image-source-card">
            <button id="selectCamera" class="source-choice">Ta bilde</button>
            <button id="selectLibrary" class="source-choice">Velg bilde</button>
          </div>
        </div>
        <span class="app-version">v1.3.9</span>
      </section>

      <section id="cameraView" class="camera-view hidden">
        <video id="camera" autoplay playsinline muted></video>
        <div class="camera-top"><button class="icon-button" id="closeCamera" aria-label="Lukk kamera">×</button><span>Ta bilde</span></div>
        <div class="camera-bottom"><button id="takePhoto" class="shutter" aria-label="Ta bilde"><i></i></button></div>
      </section>

      <section id="editorView" class="editor-view hidden">
        <div id="canvasWrap" class="canvas-wrap">
          <canvas id="photoCanvas"></canvas><canvas id="drawCanvas"></canvas><div id="textLayer"></div>
          <div class="editor-top-controls"><button class="floating-button close-button" id="backToStart" aria-label="Ferdig">Ferdig</button><button class="floating-button undo-button" id="undo" aria-label="Angre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 1 1 0 12"/></svg></button></div>
          <div class="pen-colors" id="penColors" role="group" aria-label="Velg farge"><button class="color selected" data-color="#ef4444" style="--swatch:#ef4444" aria-label="Rød"></button><button class="color" data-color="#f59e0b" style="--swatch:#f59e0b" aria-label="Gul"></button><button class="color" data-color="#22c55e" style="--swatch:#22c55e" aria-label="Grønn"></button><button class="color" data-color="#2563eb" style="--swatch:#2563eb" aria-label="Blå"></button><button class="color" data-color="#ffffff" style="--swatch:#ffffff" aria-label="Hvit"></button></div>
          <div class="editor-bottom-controls"><button class="floating-button tool-button" id="penTool" aria-label="Tegn med penn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.4-10.4a2.8 2.8 0 0 0-4-4L4.2 15zM13.2 6l4.8 4.8"/></svg></button><button class="floating-button tool-button convert-button" id="recognizeTool" aria-label="Forvandle håndskrift til tekst">T<span>✦</span></button></div>
        </div>
      </section>

      <section id="finishView" class="finish-view hidden">
        <div class="finish-brand"><img src="rumag-logo-hvit.svg" alt="RUMAG" /></div>
        <div class="finish-icon">✓</div><h1>Skissen er klar</h1><p>Del den med Outlook, Teams eller en annen app – eller lagre den for senere.</p>
        <div class="finish-actions"><button id="shareImage" class="primary-button share-button">Del skisse</button><button id="downloadImage" class="secondary-button save-button">Lagre skisse</button></div>
        <button id="deleteSketch" class="delete-button">Slett skisse</button>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <script src="app.js"></script><script src="finish.js"></script>
  </body>
</html>
